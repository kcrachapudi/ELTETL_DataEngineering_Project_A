services:

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: pipeline_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline_user:changeme@postgres:5432/pipeline_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create -u admin -p admin -f Admin -l User -r Admin -e admin@pipeline.local || true"
    restart: on-failure
    networks:
      - pipeline_network

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: pipeline_airflow
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline_user:changeme@postgres:5432/pipeline_db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'pipeline_secret_key'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/opt/airflow/project
    ports:
      - "8080:8080"
    command: bash -c "airflow scheduler & airflow webserver"
    networks:
      - pipeline_network

networks:
  pipeline_network:
    external: true